name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit frontend dependencies
        run: |
          npm audit --json > audit-frontend.json || true
          node <<'NODE'
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('audit-frontend.json', 'utf8'));
          const allow = new Set(['GHSA-qwww-vcr4-c8h2']);
          const severityGate = new Set(['high', 'critical']);
          const vulns = report.vulnerabilities || {};
          const memo = new Map();

          function getAdvisoryIds(vulnerability) {
            const viaObjects = (vulnerability.via || []).filter((item) => item && typeof item === 'object');
            return viaObjects
              .map((item) => {
                const match = (item.url || '').match(/GHSA-[A-Za-z0-9-]+/);
                return match ? match[0] : null;
              })
              .filter(Boolean);
          }

          function collectAdvisoryIds(name, visiting = new Set()) {
            if (memo.has(name)) {
              return memo.get(name);
            }

            const vulnerability = vulns[name];
            if (vulnerability === undefined) {
              memo.set(name, []);
              return [];
            }

            const advisoryIds = getAdvisoryIds(vulnerability);
            if (advisoryIds.length > 0) {
              memo.set(name, advisoryIds);
              return advisoryIds;
            }

            const referencedPackages = (vulnerability.via || []).filter((item) => typeof item === 'string');
            if (referencedPackages.length === 0 || visiting.has(name)) {
              memo.set(name, []);
              return [];
            }

            visiting.add(name);
            const collected = referencedPackages.flatMap((dep) => collectAdvisoryIds(dep, visiting));
            visiting.delete(name);

            const unique = [...new Set(collected)];
            memo.set(name, unique);
            return unique;
          }

          const blocking = Object.entries(vulns).filter(([name, vulnerability]) => (
            severityGate.has(vulnerability.severity) && (() => {
              const advisoryIds = collectAdvisoryIds(name);
              return advisoryIds.length === 0 || advisoryIds.every((id) => allow.has(id)) === false;
            })()
          ));

          if (blocking.length) {
            console.error('Blocking frontend npm audit findings detected:');
            for (const [name, vulnerability] of blocking) {
              console.error(`- ${name} (${vulnerability.severity})`);
            }
            process.exit(1);
          }

          const summary = report.metadata?.vulnerabilities || {};
          console.log('Frontend audit completed. Remaining advisories are allowlisted no-fix items only.');
          console.log(JSON.stringify(summary));
          NODE
        working-directory: frontend
