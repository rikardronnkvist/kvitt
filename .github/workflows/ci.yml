name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit all backend and frontend dependencies
        shell: bash
        run: |
          audit() {
            local project="$1" status=0
            local report="$RUNNER_TEMP/npm-audit-$project.json"
            npm --prefix "$project" audit --json --audit-level=high > "$report" || status=$?
            if (( status > 1 )); then
              cat "$report"
              return "$status"
            fi
            node - "$project" "$report" <<'NODE'
          const fs = require('fs');
          const [project, path] = process.argv.slice(2);

          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.error || report.auditReportVersion !== 2 ||
              !report.vulnerabilities || typeof report.vulnerabilities !== 'object' ||
              Array.isArray(report.vulnerabilities) || !report.metadata?.vulnerabilities) {
            console.error(`Invalid ${project} npm audit report:`, report.error || 'missing audit data');
            process.exit(1);
          }

          // Remove this exception once picomatch has a published fix. It is
          // used by backend test tooling and frontend build tooling.
          const picomatchAdvisory = 'https://github.com/advisories/GHSA-fc5q-39xc-vjpf';
          const frontendAdvisory = 'https://github.com/advisories/GHSA-qwww-vcr4-c8h2';
          const severityGate = new Set(['high', 'critical']);
          const vulns = report.vulnerabilities;

          function isAllowlisted(name, visiting = new Set()) {
            const via = vulns[name]?.via;
            if (!Array.isArray(via) || via.length === 0 || visiting.has(name)) {
              return false;
            }
            visiting.add(name);
            const allowed = via.every((cause) => {
              if (typeof cause === 'string') {
                return isAllowlisted(cause, visiting);
              }
              return (name === 'picomatch' && cause?.url === picomatchAdvisory) ||
                (project === 'frontend' && cause?.url === frontendAdvisory);
            });
            visiting.delete(name);
            return allowed;
          }

          const blocking = Object.entries(vulns).filter(([name, vulnerability]) => (
            severityGate.has(vulnerability.severity) && !isAllowlisted(name)
          ));

          if (blocking.length) {
            console.error(`Blocking ${project} npm audit findings detected:`);
            for (const [name, vulnerability] of blocking) {
              console.error(`- ${name} (${vulnerability.severity})`);
            }
            process.exit(1);
          }

          console.log(`${project} audit completed with no unallowlisted high or critical findings.`);
          console.log(JSON.stringify(report.metadata.vulnerabilities));
          NODE
          }
          audit backend
          audit frontend
