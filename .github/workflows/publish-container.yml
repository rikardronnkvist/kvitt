name: Publish Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit frontend dependencies
        run: |
          npm audit --json > audit-frontend.json || true
          node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync('audit-frontend.json','utf8'));const allow=new Set(['GHSA-qwww-vcr4-c8h2']);const vulns=Object.entries(report.vulnerabilities||{});const blocking=vulns.filter(([_,v])=>{if(!['high','critical'].includes(v.severity))return false;const via=(v.via||[]).filter((x)=>x&&typeof x==='object');if(v.fixAvailable===false&&via.length>0){const onlyAllowlisted=via.every((item)=>{const m=(item.url||'').match(/GHSA-[A-Za-z0-9-]+/);return m&&allow.has(m[0]);});if(onlyAllowlisted)return false;}return true;});if(blocking.length){console.error('Blocking frontend npm audit findings detected:');for(const [name,v] of blocking){console.error('- '+name+' ('+v.severity+')');}process.exit(1);}const summary=report.metadata&&report.metadata.vulnerabilities?report.metadata.vulnerabilities:{};console.log('Frontend audit completed. Remaining advisories are allowlisted no-fix items only.');console.log(JSON.stringify(summary));"
        working-directory: frontend

  publish:
    needs: [gitleaks, npm-audit]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - service: backend
            platforms: linux/amd64
          - service: frontend
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=main-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          vuln-type: os,library
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
